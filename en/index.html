<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LocalBoost | Let customers near you find you on Google Maps</title>
  <link rel="stylesheet" href="../assets/styles.css">
</head>
<body>
  <header>
    <div class="container header-inner">
      <div class="logo">Local<span>Boost</span></div>
      <div class="lang-switch">
        <a href="../">AR</a>
        <a href="./">EN</a>
      </div>
    </div>
  </header>
  <section class="hero">
    <div class="container">
      <h1>Let customers near you find you on Google Maps</h1>

      <a href="#contact" class="btn">Get a free 5-minute check</a>

  <section id="contact">
    <div class="container">
      <div class="contact-box">
        <h3>WhatsApp number coming soon</h3>
        <p>We're setting up the number.</p>
      </div>
    </div>
  </section>
  <footer>
    <div class="container">
      <p>LocalBoost • North Riyadh • Not affiliated with Google or Meta</p>
    </div>
  </footer>

</html>
