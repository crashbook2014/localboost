<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LocalBoost | خلّ زباين حيّك يلقونك على قوقل ماب</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header>
    <div class="container header-inner">
      <div class="logo">Local<span>Boost</span></div>
      <div class="lang-switch">
        <a href="./">AR</a>
        <a href="en/">EN</a>
      </div>
    </div>
  </header>
  <section class="hero">
    <div class="container">
      <h1>خلّ زباين حيّك يلقونك على قوقل ماب</h1>
      <p class="sub">يلقونك. يفهمونك. يجونك.</p>
      <a href="#contact" class="btn">احجز فحص مجاني ٥ دقايق</a>
    </div>
  </section>
  <section id="contact">
    <div class="container">
      <div class="contact-box">
        <h3>رقم الواتساب قريبًا</h3>
        <p>حاليًا نجهّز الرقم.</p>
      </div>
    </div>
  </section>
  <footer>
    <div class="container">
      <p>LocalBoost • شمال الرياض • غير تابعين لقوقل أو ميتا</p>
    </div>
  </footer>
</body>
</html>
